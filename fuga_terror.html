<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuga da Escola</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; color: #ddd; }
  canvas#game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #map { position: fixed; right: 10px; top: 10px; border: 1px solid #444; opacity: .85; width: 130px; height: auto; }
  #hud { position: fixed; left: 12px; top: 10px; font-size: 16px; text-shadow: 0 0 4px #000; }
  #msg { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); font-size: 18px; text-shadow: 0 0 6px #000; transition: opacity .4s; white-space: nowrap; }
  #help { position: fixed; left: 12px; bottom: 10px; font-size: 12px; opacity: .6; }
  #up { position: fixed; right: 10px; top: 150px; font-size: 11px; opacity: .7; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; text-align: center; gap: 16px; }
  #overlay button { background: #222; color: #ddd; border: 1px solid #666; padding: 10px 18px; font-family: monospace; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="map"></canvas>
<div id="hud"></div>
<div id="msg"></div>
<div id="help">WASD / setas: andar e virar · Espaço: esconder-se no armário · R: reiniciar</div>
<div id="up">figura: <input type="file" id="upfile" accept="image/*"></div>
<div id="snd" style="position:fixed;right:10px;top:175px;font-size:11px;opacity:.7">sons: <input type="file" id="sndfile" accept="audio/*" multiple></div>
<div id="overlay"><div id="otext"></div><button id="restart">Tentar de novo</button></div>

<script>
// Legenda: # parede · . chão · p início do jogador · m perseguidor · k chave · c armário · E porta de saída (trancada)
const MAP_ROWS = [
  "###########################",
  "#E.............############",
  "#..............############",
  "#..............############",
  "#############..############",
  "#.........................#",
  "#.........................#",
  "#.........................#",
  "#.........................#",
  "#########...##########....#",
  "#.................m..#.c..#",
  "#....................#....#",
  "#....................#....#",
  "#########...##########....#",
  "#...........#.............#",
  "#...........#.............#",
  "#...........#..k..........#",
  "#...........#.............#",
  "#...........#.............#",
  "#...........#.............#",
  "#...........##..###########",
  "#.........................#",
  "#####.....###..##.........#",
  "#.........#.....#.........#",
  "#....#....#..c..#...k.....#",
  "#.p..#....#.....#.........#",
  "##...#....#.....#.........#",
  "###########################"
];
const MAP_W = MAP_ROWS[0].length, MAP_H = MAP_ROWS.length;
const FOV = 0.66;

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const mv = document.getElementById('map'), mctx = mv.getContext('2d');
const hud = document.getElementById('hud'), msgEl = document.getElementById('msg');
const overlay = document.getElementById('overlay'), otext = document.getElementById('otext');
cv.width = 480; cv.height = 300;
const CELL = 9;
mv.width = MAP_W * CELL; mv.height = MAP_H * CELL;

let grid, closet, keys, total, got, door, player, chaser;
let state = 'play', time = 0, hideOn = false, lastMoveT = -99, lastSeenT = -99, lastKnown = null;
let msgTimer = 0, chaserImg = null, spacePressed = false;
let actx = null, sndMaster = null, scareBufs = [], ambNext = 3;
function ensureAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const shaper = actx.createWaveShaper();
    const curve = new Float32Array(2048);
    for (let i = 0; i < 2048; i++) { const x = i / 1023 - 1; curve[i] = Math.max(-0.8, Math.min(0.8, x * 1.6)); }
    shaper.curve = curve; shaper.oversample = 'none';
    sndMaster = actx.createGain(); sndMaster.connect(shaper); shaper.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
}
function playClip(dist, boost = 1) {
  if (!actx || !scareBufs.length) return;
  const src = actx.createBufferSource();
  src.buffer = scareBufs[Math.floor(Math.random() * scareBufs.length)];
  const v = Math.max(0, 1 - dist / 12);
  const g = actx.createGain();
  g.gain.value = (0.2 + 3.5 * v * v) * boost;
  src.connect(g); g.connect(sndMaster); src.start();
}
const held = {};

function parseMap() {
  grid = []; closet = []; keys = [];
  for (let y = 0; y < MAP_H; y++) {
    grid[y] = []; closet[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      const ch = MAP_ROWS[y][x];
      grid[y][x] = ch === '#' ? 1 : ch === 'E' ? 2 : 0;
      closet[y][x] = ch === 'c';
      if (ch === 'p') player = { x: x + .5, y: y + .5, a: 0 };
      if (ch === 'm') chaser = { x: x + .5, y: y + .5, path: [], pathT: 0, goal: null, wanderGoal: null };
      if (ch === 'k') keys.push({ x: x + .5, y: y + .5, got: false });
      if (ch === 'E') door = { x, y };
    }
  }
  total = keys.length; got = 0;
}

function reset() {
  parseMap();
  state = 'play'; time = 0; hideOn = false; lastMoveT = -99; lastSeenT = -99; lastKnown = null;
  overlay.style.display = 'none';
  showMsg('Ache as chaves e saia pela porta verde.', 3500);
}

function showMsg(t, ms = 2000) { msgEl.textContent = t; msgEl.style.opacity = 1; msgTimer = ms / 1000; }

function cellAt(x, y) {
  if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return 1;
  return grid[y][x];
}
function isWall(x, y) { return cellAt(Math.floor(x), Math.floor(y)) !== 0; }
function blocked(x, y) {
  const r = 0.2;
  return isWall(x - r, y - r) || isWall(x + r, y - r) || isWall(x - r, y + r) || isWall(x + r, y + r);
}

function lineOfSight(ax, ay, bx, by) {
  const d = Math.hypot(bx - ax, by - ay);
  if (d > 9) return false;
  const steps = Math.ceil(d / 0.1);
  for (let i = 1; i < steps; i++) {
    const x = ax + (bx - ax) * i / steps, y = ay + (by - ay) * i / steps;
    if (cellAt(Math.floor(x), Math.floor(y)) !== 0) return false;
  }
  return true;
}

function bfs(sx, sy, gx, gy) {
  const start = [Math.floor(sx), Math.floor(sy)], goal = [Math.floor(gx), Math.floor(gy)];
  const prev = new Map(), key = (x, y) => y * MAP_W + x;
  const q = [start]; let qi = 0; prev.set(key(start[0], start[1]), null);
  let found = false;
  while (qi < q.length) {
    const [x, y] = q[qi++];
    if (x === goal[0] && y === goal[1]) { found = true; break; }
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy, k = key(nx, ny);
      if (cellAt(nx, ny) === 0 && !prev.has(k)) { prev.set(k, [x, y]); q.push([nx, ny]); }
    }
  }
  if (!found) return [];
  const path = [];
  let cur = goal;
  while (cur && !(cur[0] === start[0] && cur[1] === start[1])) {
    path.unshift({ x: cur[0] + .5, y: cur[1] + .5 });
    cur = prev.get(key(cur[0], cur[1]));
  }
  return path;
}

function randomFloor() {
  for (let i = 0; i < 200; i++) {
    const x = Math.floor(Math.random() * MAP_W), y = Math.floor(Math.random() * MAP_H);
    if (grid[y][x] === 0) return { x: x + .5, y: y + .5 };
  }
  return null;
}

function update(dt) {
  if (state !== 'play') return;
  time += dt;

  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) msgEl.style.opacity = 0; }

  // Virar
  if (held.KeyA || held.ArrowLeft) player.a -= 2.2 * dt;
  if (held.KeyD || held.ArrowRight) player.a += 2.2 * dt;

  const pcx = Math.floor(player.x), pcy = Math.floor(player.y);
  const onCloset = closet[pcy][pcx];

  // Esconder-se
  if (spacePressed) {
    if (onCloset) { hideOn = !hideOn; showMsg(hideOn ? 'Você se escondeu...' : 'Você saiu do armário.'); }
    else showMsg('Não há onde se esconder.');
    spacePressed = false;
  }

  let move = 0;
  if (held.KeyW || held.ArrowUp) move = 1;
  if (held.KeyS || held.ArrowDown) move = -1;
  if (move !== 0 && hideOn) hideOn = false;

  if (move !== 0) {
    lastMoveT = time;
    const sp = 2.3 * dt * move;
    const dx = Math.cos(player.a) * sp, dy = Math.sin(player.a) * sp;
    if (!blocked(player.x + dx, player.y)) player.x += dx;
    if (!blocked(player.x, player.y + dy)) player.y += dy;
  }

  // Chaves
  for (const k of keys) {
    if (!k.got && Math.hypot(k.x - player.x, k.y - player.y) < 0.5) {
      k.got = true; got++;
      if (got === total) { grid[door.y][door.x] = 0; showMsg('Chave completa. A porta destrancou!', 3000); }
      else showMsg(`Chave encontrada (${got}/${total}).`);
    }
  }

  // Vitória
  if (Math.floor(player.x) === door.x && Math.floor(player.y) === door.y && grid[door.y][door.x] === 0) {
    state = 'win'; otext.textContent = 'Você escapou.';
    overlay.style.display = 'flex'; return;
  }

  updateChaser(dt);
}

function updateChaser(dt) {
  const c = chaser;
  const dist = Math.hypot(player.x - c.x, player.y - c.y);
  const hidden = hideOn && closet[Math.floor(player.y)][Math.floor(player.x)];
  const sees = !hidden && lineOfSight(c.x, c.y, player.x, player.y);
  const heard = !hidden && time - lastMoveT < 0.5 && dist < 4.5;

  if (sees) { lastSeenT = time; lastKnown = { x: player.x, y: player.y }; }
  if (sees && time - lastNear > 4) { lastNear = time; playClip(dist); }
  if (dist < 12) { ambNext -= dt; if (ambNext <= 0) { playClip(dist); ambNext = 1.5 + Math.random() * 4 + dist * 0.4; } }
  else if (heard) { lastSeenT = time; lastKnown = { x: player.x, y: player.y }; }

  let speed = 0.9;
  let goal = null;
  if (sees) { goal = lastKnown; speed = 1.7; }
  else if (lastKnown && time - lastSeenT < 4) { goal = lastKnown; speed = 1.3; }

  if (!goal) {
    c.wanderT = (c.wanderT || 0) - dt;
    if (!c.wanderGoal || (c.path.length === 0 && c.wanderT <= 0)) { c.wanderGoal = randomFloor(); c.wanderT = 2; }
    goal = c.wanderGoal;
  }

  c.pathT -= dt;
  if (c.pathT <= 0 || !c.goal) {
    c.path = bfs(c.x, c.y, goal.x, goal.y);
    c.goal = { x: goal.x, y: goal.y };
    c.pathT = 0.5;
  }

  if (c.path.length) {
    const n = c.path[0];
    const ddx = n.x - c.x, ddy = n.y - c.y, d = Math.hypot(ddx, ddy);
    const step = speed * dt;
    if (d <= step) { c.x = n.x; c.y = n.y; c.path.shift(); }
    else { c.x += ddx / d * step; c.y += ddy / d * step; }
  }

  if (!hidden && Math.hypot(player.x - c.x, player.y - c.y) < 0.5) {
    playClip(0, 1.5);
    state = 'over'; otext.textContent = 'Ele te pegou.';
    overlay.style.display = 'flex';
  }
}

// ---------- Render (raycasting) ----------
function render() {
  const w = cv.width, h = cv.height;
  const dirX = Math.cos(player.a), dirY = Math.sin(player.a);
  const planeX = -dirY * FOV, planeY = dirX * FOV;
  const zbuf = new Float32Array(w);

  ctx.fillStyle = '#100a0a'; ctx.fillRect(0, 0, w, h / 2);
  ctx.fillStyle = '#1b1414'; ctx.fillRect(0, h / 2, w, h / 2);

  for (let x = 0; x < w; x++) {
    const camX = 2 * x / w - 1;
    const rdx = dirX + planeX * camX || 1e-6, rdy = dirY + planeY * camX || 1e-6;
    let mapX = Math.floor(player.x), mapY = Math.floor(player.y);
    const ddx = Math.abs(1 / rdx), ddy = Math.abs(1 / rdy);
    let stepX, stepY, sdx, sdy;
    if (rdx < 0) { stepX = -1; sdx = (player.x - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - player.x) * ddx; }
    if (rdy < 0) { stepY = -1; sdy = (player.y - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - player.y) * ddy; }
    let hit = 0, side = 0;
    while (!hit) {
      if (sdx < sdy) { sdx += ddx; mapX += stepX; side = 0; }
      else { sdy += ddy; mapY += stepY; side = 1; }
      hit = cellAt(mapX, mapY);
    }
    const perp = side === 0 ? (mapX - player.x + (1 - stepX) / 2) / rdx : (mapY - player.y + (1 - stepY) / 2) / rdy;
    zbuf[x] = perp;

    const lineH = Math.min(h * 4, h / perp);
    const top = h / 2 - lineH / 2;
    const shade = Math.max(0.08, 1 - perp / 10) * (side ? 0.65 : 1);
    let base;
    if (hit === 2) base = [40, 150, 70];
    else base = ((mapX + mapY) % 2 ? [120, 110, 105] : [100, 92, 88]);
    ctx.fillStyle = `rgb(${base[0]*shade|0},${base[1]*shade|0},${base[2]*shade|0})`;
    ctx.fillRect(x, top, 1, lineH);
  }

  // Sprites (chave + perseguidor), ordenados do mais longe pro mais perto
  const sprites = [];
  for (const k of keys) if (!k.got) sprites.push({ x: k.x, y: k.y, kind: 'key' });
  sprites.push({ x: chaser.x, y: chaser.y, kind: 'chaser' });
  const dist2 = s => (s.x - player.x) ** 2 + (s.y - player.y) ** 2;
  sprites.sort((a, b) => dist2(b) - dist2(a));

  for (const s of sprites) {
    const spx = s.x - player.x, spy = s.y - player.y;
    const inv = 1 / (planeX * dirY - dirX * planeY);
    const tx = inv * (dirY * spx - dirX * spy);
    const ty = inv * (-planeY * spx + planeX * spy);
    if (ty <= 0.1) continue;
    const sx = (w / 2) * (1 + tx / ty);
    const idx = Math.floor(sx);
    if (idx < 0 || idx >= w || zbuf[idx] < ty) continue;

    const size = Math.abs(h / ty);
    const fog = Math.max(0.15, 1 - ty / 10);

    if (s.kind === 'key') {
      const r = size * 0.08, cy = h / 2 + size * 0.25;
      ctx.fillStyle = `rgba(230,190,60,${fog})`;
      ctx.beginPath(); ctx.moveTo(sx, cy - r * 1.5); ctx.lineTo(sx + r, cy); ctx.lineTo(sx, cy + r * 1.5); ctx.lineTo(sx - r, cy); ctx.fill();
    } else {
      const sh = size * 0.9, top = h / 2 - sh * 0.4;
      if (chaserImg && chaserImg.complete && chaserImg.naturalWidth) {
        const sw = sh * chaserImg.naturalWidth / chaserImg.naturalHeight;
        ctx.drawImage(chaserImg, sx - sw / 2, top, sw, sh);
        ctx.fillStyle = `rgba(0,0,0,${1 - fog})`;
        ctx.fillRect(sx - sw / 2, top, sw, sh);
      } else {
        const bw = sh * 0.35;
        ctx.fillStyle = `rgba(5,5,5,${fog + 0.2})`;
        ctx.beginPath(); ctx.arc(sx, top + sh * 0.12, sh * 0.1, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(sx - bw / 2, top + sh * 0.24, bw, sh * 0.76);
        ctx.fillStyle = `rgba(220,30,30,${fog})`;
        ctx.fillRect(sx - sh * 0.05 - sh * 0.03, top + sh * 0.1, sh * 0.03, sh * 0.03);
        ctx.fillRect(sx + sh * 0.05, top + sh * 0.1, sh * 0.03, sh * 0.03);
      }
    }
  }

  // Vinheta de escuro
  if (!window.vigGrad) { window.vigGrad = ctx.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, h * 0.9); window.vigGrad.addColorStop(0, 'rgba(0,0,0,0)'); window.vigGrad.addColorStop(1, 'rgba(0,0,0,0.85)'); }
  ctx.fillStyle = window.vigGrad; ctx.fillRect(0, 0, w, h);

  if (hideOn) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, w, h); }
  if (chaser && time - lastSeenT < 0.3 && lastKnown) { ctx.fillStyle = 'rgba(120,0,0,0.12)'; ctx.fillRect(0, 0, w, h); }
}

function renderMap() {
  mctx.fillStyle = '#000'; mctx.fillRect(0, 0, mv.width, mv.height);
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const v = grid[y][x];
    if (v === 1) mctx.fillStyle = '#555';
    else if (v === 2) mctx.fillStyle = '#2a8';
    else if (closet[y][x]) mctx.fillStyle = '#8a5a2b';
    else mctx.fillStyle = '#1a1a1a';
    mctx.fillRect(x * CELL, y * CELL, CELL, CELL);
  }
  mctx.fillStyle = '#e6be3c';
  for (const k of keys) if (!k.got) { mctx.fillRect(k.x * CELL - 2, k.y * CELL - 2, 4, 4); }
  mctx.fillStyle = '#fff';
  mctx.beginPath(); mctx.arc(player.x * CELL, player.y * CELL, 3, 0, Math.PI * 2); mctx.fill();
  mctx.strokeStyle = '#fff';
  mctx.beginPath(); mctx.moveTo(player.x * CELL, player.y * CELL);
  mctx.lineTo(player.x * CELL + Math.cos(player.a) * 8, player.y * CELL + Math.sin(player.a) * 8); mctx.stroke();
}

function updateHud() {
  hud.textContent = `Chaves: ${got}/${total}${hideOn ? '   [escondido]' : ''}`;
}

// ---------- Loop / input ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  render();
  renderMap();
  updateHud();
  requestAnimationFrame(loop);
}

addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' && !e.repeat) spacePressed = true;
  if (e.code === 'KeyR') reset();
  if (actx && actx.state === 'suspended') actx.resume();
  held[e.code] = true;
});
addEventListener('keyup', e => { held[e.code] = false; });
document.getElementById('restart').onclick = reset;
document.getElementById('sndfile').onchange = e => { ensureAudio(); for (const f of e.target.files) f.arrayBuffer().then(b => actx.decodeAudioData(b)).then(buf => scareBufs.push(buf)).catch(() => alert('Não consegui ler ' + f.name)); };
document.getElementById('upfile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.src = URL.createObjectURL(f); chaserImg = img;
};

parseMap();
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
